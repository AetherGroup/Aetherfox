name: aether-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read Firefox tag
        shell: pwsh
        run: Get-Content firefox_version.txt

      - name: Setup MozillaBuild deps (sccache)
        shell: pwsh
        run: |
          choco install sccache -y
          sccache --version

      - name: Sync Firefox + check patch-stack
        shell: pwsh
        run: python scripts/sync.py --no-download

      - name: Build (full)
        shell: pwsh
        env:
          MOZCONFIG: ${{ github.workspace }}\mozconfig.windows
        run: python scripts/build.py

      - name: Hash artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse obj-aether\dist | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: aether-0.1.0-windows-x64
          path: |
            firefox-src/obj-aether/dist/**/*.zip
            firefox-src/obj-aether/dist/**/*.exe
